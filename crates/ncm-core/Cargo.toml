[package]
name = "ncm-core"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
lofty = "0.25.4"
md-5 = "0.11.0"
ncm-api = { version = "0.2.2", path = "../ncm-api" }
ncm-player = { version = "0.2.2", path = "../ncm-player" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# 系统媒体控制（安卓走 MediaSession，不用它）
[target.'cfg(not(target_os = "android"))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1.0.11"
