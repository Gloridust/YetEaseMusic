[package]
name = "rust_lib_app"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
flutter_rust_bridge = "=2.13.0"
ncm-core = { version = "0.2.0", path = "../../crates/ncm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1.44"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
